<div id="stage"><div id="cd"></div></div>
<script>
// Event: Saturday Oct 24, 2026, 7:00 AM Arizona time (MST, UTC-7 year-round) = 14:00 UTC.
var START=Date.UTC(2026,9,24,14,0,0);
var DAY_END=Date.UTC(2026,9,25,7,0,0); // midnight AZ after the event
var q=new URLSearchParams(location.search), off=q.get("now")?Date.parse(q.get("now"))-Date.now():0;
var cd=document.getElementById("cd");
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById("stage");
  st.style.transform="scale("+s+")";st.style.left=((innerWidth-1920*s)/2)+"px";st.style.top=((innerHeight-1080*s)/2)+"px";}
function p(n){return (n<10?"0":"")+n}
function tick(){
  var now=Date.now()+off, d=START-now;
  if(now>=DAY_END){cd.style.display="none";return;}  // after event day: original tagline shows again
  if(d<=0){cd.innerHTML='<div class="msg"><b>Happening</b> today</div>';return;}
  var s=Math.floor(d/1000),D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;
  var u=function(n,l){return '<div class="u"><span class="n">'+n+'</span><span class="l">'+l+'</span></div>'},x='<span class="sep">:</span>';
  cd.innerHTML='<span class="lead">STARTS<br>IN</span>'+(D>0?u(D,"DAYS")+x:"")+u(p(H),"HRS")+x+u(p(M),"MIN")+x+u(p(S),"SEC");
}
addEventListener("resize",fit);fit();tick();setInterval(tick,1000);
// Daily reload so a long-running player never drifts or gets stuck
setTimeout(function(){location.reload()},6*3600*1000);
</script></body></html>
